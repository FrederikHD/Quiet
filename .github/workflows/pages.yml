# Builds quiet-explorer and publishes it to GitHub Pages.
# One-time setup: repository Settings → Pages → Source: "GitHub Actions".
name: Explorer on GitHub Pages

on:
  push:
    branches: [main, claude/quiet-design-system-access-yoz9ny]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the explorer
        run: npm run build -w quiet-explorer
        env:
          EXPLORER_BASE: /${{ github.event.repository.name }}/
      # Pages has no SPA fallback: serve the app for deep links such as /components/button/playground.
      - run: cp packages/quiet-explorer/dist/index.html packages/quiet-explorer/dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/quiet-explorer/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
