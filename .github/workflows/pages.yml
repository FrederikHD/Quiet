# Publishes quiet-explorer to GitHub Pages, in two versions: the latest release at the site's root (the default, matching
# npm) and develop under next/. A switch in the explorer's header moves between them. Every run builds both, so it runs
# on each push to develop, from the release workflow after publishing, and by hand (Actions → Run workflow).
# One-time setup: repository Settings → Pages → Source: "GitHub Actions".
name: Explorer on GitHub Pages

on:
  push:
    branches: [develop]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Queued, not cancelled: a release's deploy must not be cut off by a push. The last run wins, and every run builds both.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # next/ is always develop, also when the release workflow calls this from a tag push (whose checkout would
          # otherwise be the tag). The root is built from the latest release tag either way.
          ref: develop
          fetch-depth: 0 # the release tags: the root is built from the latest one
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the released and the develop explorer
        run: packages/quiet-explorer/scripts/build-pages.sh /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
