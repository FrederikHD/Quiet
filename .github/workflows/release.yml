# Publishes @frederikhd/quiet to npm, started either way:
#   - push a version tag (git tag v0.2.0 && git push origin v0.2.0), or
#   - Actions → Release → "Run workflow" on a branch: releases the version in packages/quiet/package.json and creates
#     its tag (v<version>) on that commit.
# Then:
#   1. the version must have a section in CHANGELOG.md (and match the tag, or have no tag yet);
#   2. the full CI suite runs (types, unit, package check, browser tests);
#   3. the package is published with provenance, and a GitHub Release is created from the changelog section;
#   4. the explorer is deployed to GitHub Pages, so the docs match what is on npm.
# How to release: see "Releasing" in the root README. Needs the repository secret NPM_TOKEN (an npm automation token).
name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        name: Tag, package version and changelog agree
        run: |
          pkg="$(node -p "require('./packages/quiet/package.json').version")"
          if [ "$GITHUB_REF_TYPE" = "branch" ] && [ "$GITHUB_REF_NAME" != "develop" ] && [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "::error::Releases run from develop or main, not $GITHUB_REF_NAME"; exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            if [ "${GITHUB_REF_NAME#v}" != "$pkg" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match packages/quiet/package.json version $pkg"; exit 1
            fi
          elif git ls-remote --exit-code --tags origin "refs/tags/v$pkg" > /dev/null; then
            echo "::error::v$pkg is already released. Bump the version in packages/quiet/package.json first."; exit 1
          fi
          if ! grep -q "^## \[$pkg\]" packages/quiet/CHANGELOG.md; then
            echo "::error::packages/quiet/CHANGELOG.md has no '## [$pkg]' section"; exit 1
          fi
          echo "version=$pkg" >> "$GITHUB_OUTPUT"
          case "$pkg" in *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;; *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;; esac

  test:
    needs: verify
    uses: ./.github/workflows/ci.yml

  publish:
    needs: [verify, test]
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write # the GitHub Release
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build -w @frederikhd/quiet
      - name: Publish to npm
        # A version like 0.2.0-beta.1 goes out under the "next" tag, so `npm install` keeps getting the last stable one.
        run: npm publish -w @frederikhd/quiet --provenance --access public ${{ needs.verify.outputs.prerelease == 'true' && '--tag next' || '' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: GitHub Release from the changelog
        run: |
          v="${{ needs.verify.outputs.version }}"
          awk -v v="$v" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## \[|^\[[^]]+\]: / {if (on) exit} on' packages/quiet/CHANGELOG.md > notes.md
          printf '\n---\nnpm: https://www.npmjs.com/package/@frederikhd/quiet/v/%s\n' "$v" >> notes.md
          # --target: on a manual run this creates the tag on the commit that was tested (a tag made with the workflow's own
          # token doesn't start another run); on a tag push the tag already exists there.
          gh release create "v$v" --target "$GITHUB_SHA" --title "@frederikhd/quiet $v" --notes-file notes.md \
            ${{ needs.verify.outputs.prerelease == 'true' && '--prerelease' || '' }}
        env:
          GH_TOKEN: ${{ github.token }}

  docs:
    needs: publish
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
