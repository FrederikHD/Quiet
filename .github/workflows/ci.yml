# Lint, formatting, type-checks, unit tests, the package check (the packed tarball installed into a fresh app) and the
# Playwright suite (e2e, keyboard, accessibility, responsive) on every push and PR, in Chromium, Firefox and WebKit
# (Safari's engine), plus the screenshot comparison and the example shop. The release workflow runs it too, before publishing.
name: CI

on:
  # A PR runs it once (pull_request); pushes run it only on the long-lived branches, so a PR's branch isn't tested
  # twice. Tags run it through the release workflow.
  push:
    branches: [develop, main]
  pull_request:
  workflow_call:

# A new push to a PR cancels its run that is still going.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run test:package
      - run: npx playwright install --with-deps chromium
        working-directory: packages/quiet-test
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: packages/quiet-test/playwright-report
          retention-days: 7

  browsers:
    # The same e2e suite in the other engines. Screenshots stay Chromium-only (the visual job).
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    name: e2e (${{ matrix.browser }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
        working-directory: packages/quiet-test
      - run: npx playwright test --project=e2e-${{ matrix.browser }}
        working-directory: packages/quiet-test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-${{ matrix.browser }}
          path: packages/quiet-test/playwright-report
          retention-days: 7

  playwright:
    # The installed @playwright/test version, from the lockfile: the visual job's image follows it, so a Playwright
    # update (Dependabot's included) moves both together.
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"

  example:
    # The example shop (examples/shop) as an adopter's Nuxt app: this checkout of the library packed and installed in
    # place of the npm version, every page prerendered in English and German, then checked in Chromium (axe in both
    # themes, no hydration mismatch or console error, a purchase in German).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            examples/shop/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        working-directory: packages/quiet-test
      - run: npm run test:example

  visual:
    # Every example, light and dark, compared with the baselines in packages/quiet-test/e2e/__screenshots__. It runs in
    # the Playwright image the baselines are made in (`npm run test:visual:update`), so fonts and rendering match pixel
    # for pixel.
    needs: playwright
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright.outputs.version }}-noble
      options: --ipc=host
    env:
      HOME: /root
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright test --project=visual
        working-directory: packages/quiet-test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-visual
          path: packages/quiet-test/playwright-report
          retention-days: 7
