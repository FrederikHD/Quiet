# Type-checks, unit tests, the package check (the packed tarball installed into a fresh app) and the Playwright suite
# (e2e, keyboard, accessibility, responsive) on every push and PR. The release workflow runs it too, before publishing.
name: CI

on:
  push:
    branches: ['**'] # tags run it through the release workflow
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run test:package
      - run: npx playwright install --with-deps chromium
        working-directory: packages/quiet-test
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: packages/quiet-test/playwright-report
          retention-days: 7
