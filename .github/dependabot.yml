# Weekly dependency updates, grouped so they arrive as a few PRs, not dozens. Playwright gets its own PR: CI runs the
# screenshot tests in the Playwright image of the same version, so a new Playwright can render differently. If the
# visual job fails on that PR, regenerate the baselines on its branch (CONTRIBUTING.md, Visual tests).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # TypeScript majors wait until vue-tsc supports them; @types/node follows the Node version CI runs (22).
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # React is only the design-system check's stand-in for a claude.ai canvas, which runs React 18 from its UMD
      # builds; React 19 ships no UMD builds. Move both when the canvas does.
      - dependency-name: react
        update-types: ['version-update:semver-major']
      - dependency-name: react-dom
        update-types: ['version-update:semver-major']
    groups:
      playwright:
        patterns: ['@playwright/test', 'playwright', 'playwright-core']
      vue:
        patterns: ['vue', '@vue/*', 'vue-router', 'vue-tsc', 'vue-component-meta', '@vitejs/plugin-vue']
      build-and-test:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: npm
    # The example shop has its own lockfile (it installs the library from npm, like an adopter's app).
    directory: /examples/shop
    schedule:
      interval: weekly
    ignore:
      # As for the root: TypeScript majors wait until vue-tsc (nuxt typecheck) supports them.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    groups:
      example:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
